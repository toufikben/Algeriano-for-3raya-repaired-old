name: Build Signed APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  # Never cancel a release build on main. This job does not just compile: it
  # creates a GitHub Release and then uploads the assets to it, so a cancel
  # between those two steps leaves a published release with no binaries, and the
  # tag is keyed to the commit, so the re-run has to clean up after it. Feature
  # branches keep the old behaviour: only their latest commit matters.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

env:
  JDK_VERSION: 21

jobs:
  release:
    name: Build and verify signed release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: temurin
        # Gradle caching is handled by gradle/actions/setup-gradle below (single cache owner).

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is missing" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is missing" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is missing" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is missing" >&2; exit 1; }
          echo "All signing secrets are present."

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/phone-fortress-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          # Use GITHUB_ENV heredoc delimiters so passwords with special characters
          # ($, quotes, spaces, ...) are written to the environment verbatim.
          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            # The Gradle script uses STORE_PASSWORD for the keystore password.
            echo "STORE_PASSWORD<<EOF_STORE_PASSWORD"
            printf '%s\n' "$KEYSTORE_PASSWORD"
            echo "EOF_STORE_PASSWORD"
            echo "KEY_ALIAS<<EOF_KEY_ALIAS"
            printf '%s\n' "$KEY_ALIAS"
            echo "EOF_KEY_ALIAS"
            echo "KEY_PASSWORD<<EOF_KEY_PASSWORD"
            printf '%s\n' "$KEY_PASSWORD"
            echo "EOF_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # One Gradle invocation instead of four. Each ./gradlew start pays a fresh
      # configuration pass (~30-40 s on this project) and re-walks the same model,
      # so four steps meant paying that four times for no extra coverage.
      # --continue keeps the diagnostics the separate steps had: every task still
      # runs and reports, and the step fails at the end with all failures listed.
      - name: Unit tests, lint, and release builds
        run: ./gradlew test lint assembleRelease bundleRelease --continue --no-daemon --stacktrace

      # Room exports its schema at compile time; the JSON belongs in git so migrations can be
      # tested. CI is the only compiler, so it shows the file and fails the run when the
      # committed copy is missing or stale.
      - name: Check the exported Room schema is committed
        run: |
          set -euo pipefail
          find app/schemas -name '*.json' -print -exec cat {} '+'
          git status --porcelain app/schemas
          test -z "$(git status --porcelain app/schemas)" || { echo "::error::app/schemas changed during the build; commit the files shown above" >&2; exit 1; }

      - name: Verify signed artifacts and package identity
        env:
          EXPECTED_PACKAGE: com.toufikbendjeddah.phonefortress
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          "$APKSIGNER" verify --verbose "$APK"
          unzip -t "$AAB" >/dev/null
          test -s "$APK"
          test -s "$AAB"

          # Real package-identity check: extract the package id from the APK and compare it.
          ACTUAL_PACKAGE="$("$AAPT2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          echo "Detected APK package: $ACTUAL_PACKAGE"
          if [ "$ACTUAL_PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::APK package identity mismatch: expected '$EXPECTED_PACKAGE', got '$ACTUAL_PACKAGE'" >&2
            exit 1
          fi

          # Recorded so each run states which version it could have submitted: Play
          # rejects a bundle whose versionCode is already live, and nothing else here prints it.
          "$AAPT2" dump badging "$APK" | sed -nE "s/.*versionCode='([^']*)' versionName='([^']*)'.*/versionCode=\\1 versionName=\\2/p"

          echo "APK SHA-256:"
          sha256sum "$APK"
          echo "AAB SHA-256:"
          sha256sum "$AAB"
          echo "Signed release artifacts verified for $EXPECTED_PACKAGE"

      - name: Publish the signed build as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          # Release assets are not counted against the Actions artifact budget, so this is
          # the download path that survives the account-wide storage quota the upload steps
          # below keep hitting.
          VERSION="$("$AAPT2" dump badging "$APK" | sed -nE "s/.*versionCode='([^']*)' versionName='([^']*)'.*/\\1 (\\2)/p")"
          test -n "$VERSION"
          TAG="build-${GITHUB_SHA::7}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Phone Fortress $VERSION — run #${{ github.run_number }}" \
            --notes "Signed release build from run #${{ github.run_number }}. Upload the **.aab** to Play Console; the **.apk** is for installing on a test device."
          gh release upload "$TAG" "$APK" "$AAB" --clobber
          gh release view "$TAG" --json tagName,assets --jq '"Released \(.tagName) with: \([.assets[].name] | join(", "))"'

      # Kept as a convenience copy only: the account-wide artifact quota must not turn a
      # fully verified build into a red run, so these steps do not gate the verdict.
      - name: Upload signed APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-fortress-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          # Private repos share a 500 MB artifact budget and the default retention
          # is 90 days: runs #104-#107 built every artifact fine but could not upload
          # any of them. Only the current build is ever needed.
          retention-days: 7

      - name: Upload signed AAB
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-fortress-release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
